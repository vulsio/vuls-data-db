name: diff-guard
description: |
  Compare a freshly built vuls.db against a baseline pulled from a container
  registry. Runs `vuls diff detection` (against two vuls0 binaries: master HEAD
  and a pinned older commit) and `vuls diff db`, emitting step summaries and
  failing the job if any check exceeds its configured thresholds.

  Thresholds are per change axis, each judged against its own threshold
  for every (target, data source) pair: `vuls diff db` judges the added,
  changed and removed units; `vuls diff detection` judges only added and
  removed (it compares CVE ID sets, so there is no content to call
  changed). Routine additions can thus be tolerated while removals stay
  tightly bounded. Defaults are given per axis (`<axis>:<rate>`) and
  overrides name the axis they relax (`<key>=<axis>:<rate>`).

  Two input families select which vuls2 flag family is passed. The
  per-axis inputs (`db_rate_thresholds`, `db_rate_threshold_overrides`,
  `detection_rate_thresholds`, `detection_rate_threshold_overrides`)
  drive `--rate-threshold` / `--rate-threshold-override`. The legacy
  inputs (`db_change_rate_threshold`, `db_change_rate_threshold_overrides`,
  `detection_change_rate_threshold`,
  `detection_change_rate_threshold_overrides`) drive the single
  combined-rate `--change-rate-threshold` /
  `--change-rate-threshold-override`, which every vuls2 accepts. The
  legacy family exists for callers whose vuls2 predates the axis split
  (db-main.yml installs vuls@main) and is removed once every caller runs
  a vuls2 with the per-axis flags. Giving inputs from both families is an
  error; giving none means the per-axis family with vuls2's built-in
  defaults.

  All guard steps are kept inside this composite action so the caller only
  needs a single `uses:` step to run the whole gate.

  Sanity-check strategy (the order steps run in):
    1. Detection against vuls0 master HEAD — a large detection gap almost
       always means the DB should not ship.
    2. Detection against a slightly older pinned vuls0 binary — catches
       regressions that only surface against past vuls0 versions.
    3. `vuls diff db` last — structural changes to the extracted data can
       legitimately inflate the raw DB diff even when detection is stable.
       If detection shows near-zero change but only `diff db` fails, the
       failure is easier to interpret because the earlier detection checks
       already established detection stability.

  Step-summary layout strategy:
    The job summary is rendered in step order, so the aggregate
    "Diff guard summary" table unavoidably comes last. To keep it visible
    without scrolling, everything above it is kept short: binary/fixture
    metadata blocks are collapsed into <details>, and each diff section
    shows only an excerpt (the report's overall **Result** line plus the
    FAIL rows of its Summary table) with the full report collapsed into
    <details>. The rendering is shared by all three diff steps via
    render-excerpt.sh next to this manifest; its header comment documents
    the vuls2 report-format properties the excerpt relies on.

  Failure-handling strategy:
    All three diff steps record their exit code as a step output (`rc`) and
    continue rather than aborting the job. A final aggregation step reads
    those outputs, prints a summary table, and fails the job if any check
    tripped its threshold. This guarantees that one failing check does not
    hide the signals from the others — when triage is needed the step
    summary always contains all three diffs.

    To make this guarantee robust, each diff step keeps `set +e` in
    effect for the *entire* step (rather than re-enabling `set -e` after
    capturing rc), so a stray failure on the summary-write path cannot
    abort the step before its `$GITHUB_OUTPUT` line is written. Reports
    are emitted via `if [ -s <file> ]; then head ...; else placeholder;`
    so a missing/empty report file is surfaced as a placeholder rather
    than crashing the step. Each diff step additionally carries
    `continue-on-error: true` so a signal-kill or other unexpected
    abort of one diff step does not skip the rest; downstream steps
    still run via the default success() gate (because
    `continue-on-error` re-maps a failure outcome to a success-style
    conclusion), capture their own rc, and the aggregator surfaces
    any genuinely missing rc as MISSING.

    (We would prefer to also wrap the aggregator in `if: always()` so
    a failure in a non-`continue-on-error` setup step — install /
    prepare-scan-results — would still produce a summary. But the
    composite-action manifest loader switches to a legacy code path
    once any step carries `continue-on-error`, and the legacy loader
    rejects status-check function calls in `if:` even on the terminal
    step. The trade-off is acceptable: setup-step failures are
    genuine bugs the operator sees in the run UI directly anyway.)

    Exit-code policy: the aggregation step preserves the *first* non-zero
    rc in step order (master HEAD → older binary → diff db) as the
    action's exit code, matching the rc the old `exit "$rc"` design would
    have returned in both single- and multi-failure cases. A missing
    output (the upstream step crashed before recording its rc) is
    rendered as `MISSING` in the summary table, surfaced as `?` in the
    diagnostic line, and counted as failure (exit rc=1).

inputs:
  target_db:
    description: Path to the freshly built vuls.db to validate.
    required: true
  baseline_repository:
    description: OCI reference (repo:tag) to fetch the baseline vuls.db from.
    required: true
  db_rate_thresholds:
    description: |
      `vuls diff db` default thresholds (%) per (ecosystem, data source),
      one "<axis>:<rate>" per line where axis is added, changed or removed
      (e.g. "removed:10"). An axis not named keeps the vuls2 built-in
      default (added:30, changed:10, removed:10). Blank/whitespace-only
      lines are dropped.
    required: false
    default: ""
  db_rate_threshold_overrides:
    description: |
      Overrides of the `vuls diff db` per-axis thresholds. One entry per
      line, "<key>=<axis>:<rate>" where key is "<ecosystem>" (e.g.
      "ubuntu:26.04", applies to every data source in that ecosystem) or
      "<ecosystem>/<source>" (e.g. "cpe/cisco-json", single source, wins
      over the ecosystem key) and axis is added, changed or removed. An
      entry relaxes only the axis it names (e.g. "ubuntu:26.04=added:80").
      Blank/whitespace-only lines are dropped. Empty value means "no
      overrides" — every (ecosystem, source) uses the db_rate_thresholds
      defaults.
    required: false
    default: ""
  detection_rate_thresholds:
    description: |
      `vuls diff detection` default thresholds (%) per (scan result, data
      source), one "<axis>:<rate>" per line where axis is added or removed
      (the detection diff has no changed axis; e.g. "removed:5"). An axis
      not named keeps the vuls2 built-in default (added:30, removed:5).
      Blank/whitespace-only lines are dropped.
    required: false
    default: ""
  detection_rate_threshold_overrides:
    description: |
      Overrides of the `vuls diff detection` per-axis thresholds. One entry
      per line, "<key>=<axis>:<rate>" where key is "<file-basename>" (e.g.
      "debian_13", applies to every data source detected in that file) or
      "<file-basename>/<source>" (e.g. "cpe_jvn/jvn-feed-rss", single
      source, wins over the file key) and axis is added or removed (the
      detection diff has no changed axis). An entry relaxes only the axis
      it names (e.g. "debian_13=added:50"). The basename is the scan-result
      file name without ".json". Blank/whitespace-only lines are dropped.
    required: false
    default: ""
  db_change_rate_threshold:
    description: |
      Legacy family: `vuls diff db` single combined change rate (%)
      threshold per (ecosystem, data source), passed as
      `--change-rate-threshold`. Only for callers whose vuls2 predates the
      per-axis flags; cannot be combined with the per-axis inputs.
    required: false
    default: ""
  db_change_rate_threshold_overrides:
    description: |
      Legacy family: overrides of db_change_rate_threshold. One entry per
      line, "<ecosystem>=<rate>" (every data source in that ecosystem) or
      "<ecosystem>/<source>=<rate>" (single source, wins over the ecosystem
      key). Blank/whitespace-only lines are dropped. Requires
      db_change_rate_threshold.
    required: false
    default: ""
  detection_change_rate_threshold:
    description: |
      Legacy family: `vuls diff detection` single combined change rate (%)
      threshold per (scan result, data source), passed as
      `--change-rate-threshold`. Only for callers whose vuls2 predates the
      per-axis flags; cannot be combined with the per-axis inputs.
    required: false
    default: ""
  detection_change_rate_threshold_overrides:
    description: |
      Legacy family: overrides of detection_change_rate_threshold. One
      entry per line, "<file-basename>=<rate>" (every data source detected
      in that file) or "<file-basename>/<source>=<rate>" (single source,
      wins over the file key). Blank/whitespace-only lines are dropped.
      Requires detection_change_rate_threshold.
    required: false
    default: ""
  integration_ref:
    description: vulsio/integration commit SHA to pin scan-result fixtures to.
    required: false
    default: a612a993a1158c5079439adc4cb3422baaf595d8
  vuls0_old_ref:
    description: future-architect/vuls commit SHA for the older-binary detection check.
    required: false
    default: 3266337a725b1209503128a32187e09b39c89b5d

runs:
  using: composite
  steps:
    - name: Record vuls (vuls2) binary metadata
      shell: bash
      run: |
        # Diff behavior (thresholds, output format) can change across vuls2
        # nightlies, so capture the exact binary being used to drive
        # `vuls diff ...` alongside the vuls0 binaries recorded below.
        # Collapsed (like every metadata block below) so the aggregate
        # "Diff guard summary" table at the bottom stays within the first
        # screen of the job summary. See "Step-summary layout strategy".
        {
          echo "<details><summary>vuls (vuls2) driving diff checks</summary>"
          echo ""
          echo '```text'
          go version -m "$(command -v vuls)" 2>&1 | awk '$1=="mod" && $2=="github.com/MaineK00n/vuls2"' || true
          echo '```'
          echo ""
          echo "</details>"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Fetch baseline vuls.db
      shell: bash
      run: vuls db fetch --dbpath ./baseline.db --repository "${{ inputs.baseline_repository }}" --no-progress

    - name: Install vuls0 (future-architect/vuls master)
      shell: bash
      run: |
        mkdir -p /tmp/vuls0-bin
        GOBIN=/tmp/vuls0-bin go install github.com/future-architect/vuls/cmd/vuls@master
        mv /tmp/vuls0-bin/vuls /tmp/vuls0-bin/vuls0
        echo "VULS0=/tmp/vuls0-bin/vuls0" >> "$GITHUB_ENV"

        # `go version -m` reads the module metadata Go embeds into every
        # binary; the `mod` line's pseudo-version carries both the build
        # timestamp and short commit hash
        # (e.g. `v0.38.7-0.YYYYMMDDHHMMSS-<shorthash>`).
        {
          echo "<details><summary>vuls0 under test (master HEAD)</summary>"
          echo ""
          echo '```text'
          go version -m /tmp/vuls0-bin/vuls0 2>&1 | awk '$1=="mod" && $2=="github.com/future-architect/vuls"' || true
          echo '```'
          echo ""
          echo "</details>"
        } >> "$GITHUB_STEP_SUMMARY"

    # Pin vulsio/integration to a specific commit so scan-result fixtures used
    # by `vuls diff detection` do not change independently of this repo.
    - name: Check out vulsio/integration (pinned) for scan-result fixtures
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        repository: vulsio/integration
        ref: ${{ inputs.integration_ref }}
        path: integration

    - name: Prepare scan results (vuls2-supported families only)
      shell: bash
      run: |
        mkdir -p ./scan-results
        # Copy all scan results then drop CentOS, which vuls2 does not handle
        # (see vuls/detector/detector.go DetectPkgCves switch). Windows is now
        # KEPT: vuls0 master detects Windows via vuls2, so the windows fixtures
        # exercise the microsoft data in the DB under test.
        cp ./integration/data/results/*.json ./scan-results/
        rm -f ./scan-results/centos_*.json
        ls -1 ./scan-results

        integration_sha=$(git -C ./integration rev-parse HEAD)
        {
          echo "<details><summary>Scan-result fixtures source</summary>"
          echo ""
          echo "- vulsio/integration @ \`${integration_sha}\`"
          echo ""
          echo "</details>"
        } >> "$GITHUB_STEP_SUMMARY"

    # Centralizes the threshold / override input handling for all three
    # diff steps below: picks the flag family from which inputs were
    # given and turns the multi-line lists into CSV. Rule for the lists:
    # `awk 'NF'` drops blank/whitespace-only lines (NF is 0 for them);
    # `paste -sd, -` joins survivors with ",". Whitespace around each
    # entry is intentionally NOT trimmed here — vuls2 trims around the
    # separators itself. An empty result is forwarded as-is: vuls2's
    # StringSlice flag parses "" into an empty list, i.e. built-in
    # defaults / no overrides. Per-axis entries carry their axis
    # ("<axis>:<rate>" / "<key>=<axis>:<rate>"); the axis is validated by
    # vuls2, not here.
    - name: Parse thresholds and overrides
      id: parse_thresholds
      shell: bash
      env:
        DETECTION_THRESHOLDS: ${{ inputs.detection_rate_thresholds }}
        DETECTION_OVERRIDES: ${{ inputs.detection_rate_threshold_overrides }}
        DB_THRESHOLDS: ${{ inputs.db_rate_thresholds }}
        DB_OVERRIDES: ${{ inputs.db_rate_threshold_overrides }}
        LEGACY_DETECTION_THRESHOLD: ${{ inputs.detection_change_rate_threshold }}
        LEGACY_DETECTION_OVERRIDES: ${{ inputs.detection_change_rate_threshold_overrides }}
        LEGACY_DB_THRESHOLD: ${{ inputs.db_change_rate_threshold }}
        LEGACY_DB_OVERRIDES: ${{ inputs.db_change_rate_threshold_overrides }}
      run: |
        # GitHub's `shell: bash` already runs with `-eo pipefail`; set it
        # explicitly so the fail-fast contract is visible at the call site
        # and not reliant on the runner default — if `awk`/`paste` fail
        # the step aborts instead of silently emitting empty lists.
        set -euo pipefail
        to_csv() { printf '%s' "$1" | awk 'NF' | paste -sd, -; }
        # An input counts as given when it has any non-blank content.
        given() { [ -n "$(printf '%s' "$1" | awk 'NF')" ]; }

        family=axes
        if given "$LEGACY_DETECTION_THRESHOLD" || given "$LEGACY_DETECTION_OVERRIDES" \
           || given "$LEGACY_DB_THRESHOLD" || given "$LEGACY_DB_OVERRIDES"; then
          family=legacy
        fi
        if [ "$family" = legacy ] && { given "$DETECTION_THRESHOLDS" || given "$DETECTION_OVERRIDES" \
           || given "$DB_THRESHOLDS" || given "$DB_OVERRIDES"; }; then
          echo "::error::diff-guard: both the per-axis inputs (*_rate_thresholds / *_rate_threshold_overrides) and the legacy inputs (*_change_rate_threshold / *_change_rate_threshold_overrides) were given; use one family" >&2
          exit 1
        fi
        # --change-rate-threshold is a number, not a list: an override
        # list without the scalar would reach vuls2 as an empty number.
        if [ "$family" = legacy ] && { ! given "$LEGACY_DETECTION_THRESHOLD" || ! given "$LEGACY_DB_THRESHOLD"; }; then
          echo "::error::diff-guard: the legacy inputs need both detection_change_rate_threshold and db_change_rate_threshold" >&2
          exit 1
        fi

        # printf, not echo: a value beginning with `-` (e.g. `-n`) or
        # containing backslashes is written verbatim, avoiding echo's
        # implementation-defined option/escape handling.
        printf '%s\n' "family=${family}" >> "$GITHUB_OUTPUT"
        if [ "$family" = legacy ]; then
          printf '%s\n' "detection_legacy_threshold=$(printf '%s' "$LEGACY_DETECTION_THRESHOLD" | awk 'NF' | head -1 | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
          printf '%s\n' "db_legacy_threshold=$(printf '%s' "$LEGACY_DB_THRESHOLD" | awk 'NF' | head -1 | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
          printf '%s\n' "detection_overrides_csv=$(to_csv "$LEGACY_DETECTION_OVERRIDES")" >> "$GITHUB_OUTPUT"
          printf '%s\n' "db_overrides_csv=$(to_csv "$LEGACY_DB_OVERRIDES")" >> "$GITHUB_OUTPUT"
        else
          printf '%s\n' "detection_thresholds_csv=$(to_csv "$DETECTION_THRESHOLDS")" >> "$GITHUB_OUTPUT"
          printf '%s\n' "detection_overrides_csv=$(to_csv "$DETECTION_OVERRIDES")" >> "$GITHUB_OUTPUT"
          printf '%s\n' "db_thresholds_csv=$(to_csv "$DB_THRESHOLDS")" >> "$GITHUB_OUTPUT"
          printf '%s\n' "db_overrides_csv=$(to_csv "$DB_OVERRIDES")" >> "$GITHUB_OUTPUT"
        fi

    - name: Diff detection between baseline and target DBs
      id: diff_detection_master
      # See the `Failure-handling strategy` section in the action's
      # description for why this is `continue-on-error: true` rather
      # than `if: always()`.
      continue-on-error: true
      shell: bash
      env:
        TARGET_DB: ${{ inputs.target_db }}
        FAMILY: ${{ steps.parse_thresholds.outputs.family }}
        LEGACY_THRESHOLD: ${{ steps.parse_thresholds.outputs.detection_legacy_threshold }}
        THRESHOLDS_CSV: ${{ steps.parse_thresholds.outputs.detection_thresholds_csv }}
        OVERRIDES_CSV: ${{ steps.parse_thresholds.outputs.detection_overrides_csv }}
      run: |
        # No `set -e` after `rc=$?` — the rest of the step must reach
        # the final `echo "rc=..." >> $GITHUB_OUTPUT` so the aggregator
        # can read it.
        set +e
        set -o pipefail

        # The list values are passed verbatim: vuls2's StringSlice flag
        # parses an empty value into an empty list, so the
        # built-in-defaults / no-overrides paths need no special-casing
        # here.
        # Flag family chosen by the `Parse thresholds and overrides` step
        # from which inputs the caller gave (see the action description).
        case "$FAMILY" in
          legacy) set -- --change-rate-threshold "$LEGACY_THRESHOLD" --change-rate-threshold-override "$OVERRIDES_CSV" ;;
          *)      set -- --rate-threshold "$THRESHOLDS_CSV" --rate-threshold-override "$OVERRIDES_CSV" ;;
        esac
        vuls diff detection \
          ./scan-results \
          ./baseline.db "$VULS0" \
          "$TARGET_DB" "$VULS0" \
          "$@" \
          | tee ./diff-detection-report.md
        rc=$?

        echo "---" >> "$GITHUB_STEP_SUMMARY"
        echo "## Diff detection (vuls0 master HEAD) — rc=${rc}" >> "$GITHUB_STEP_SUMMARY"
        # Excerpt (Result line + FAIL rows) with the full report collapsed
        # into <details>; rendering is shared with the other two diff
        # steps via render-excerpt.sh (see its header comment).
        bash "${GITHUB_ACTION_PATH}/render-excerpt.sh" ./diff-detection-report.md 100 >> "$GITHUB_STEP_SUMMARY"
        # Defer failure: final "Aggregate diff results" step exits non-zero
        # if any diff tripped its threshold, so that all three diffs always
        # run and their summaries are available for triage.
        echo "rc=${rc}" >> "$GITHUB_OUTPUT"

    # Additional check with a slightly older vuls0 binary (pinned commit) to
    # catch regressions that only surface against past vuls0 versions.
    - name: Install vuls0 for older-binary check (pinned commit)
      shell: bash
      env:
        VULS0_OLD_REF: ${{ inputs.vuls0_old_ref }}
      run: |
        mkdir -p /tmp/vuls0-old-bin
        GOBIN=/tmp/vuls0-old-bin go install "github.com/future-architect/vuls/cmd/vuls@${VULS0_OLD_REF}"
        mv /tmp/vuls0-old-bin/vuls /tmp/vuls0-old-bin/vuls0-old
        echo "VULS0_OLD=/tmp/vuls0-old-bin/vuls0-old" >> "$GITHUB_ENV"

        {
          echo "<details><summary>vuls0 under test (older pinned @${VULS0_OLD_REF:0:7})</summary>"
          echo ""
          echo '```text'
          go version -m /tmp/vuls0-old-bin/vuls0-old 2>&1 | awk '$1=="mod" && $2=="github.com/future-architect/vuls"' || true
          echo '```'
          echo ""
          echo "</details>"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Prepare scan results for older-binary check (drop families unsupported by older vuls0)
      shell: bash
      run: |
        # Start from the already-filtered master-HEAD set (centos gone) and
        # additionally remove families the pinned older vuls0 cannot process.
        # This is expressed as a *blacklist* so new families added upstream
        # are retained automatically; only known-broken ones need listing
        # here. Update this set when bumping `vuls0_old_ref`.
        #
        # Windows is removed here but KEPT for the master-HEAD check above:
        # the pinned older vuls0 predates "detect windows with vuls2" and
        # still routes Windows to gost, so it does not exercise the vuls2 DB.
        # Drop windows from this older-binary set until `vuls0_old_ref` is
        # bumped past that change.
        #
        # Every cpe_*.json (pseudo servers with cpeNames) is likewise removed:
        # the pinned older vuls0 predates "detect CPE with vuls2" and routes
        # CPE URIs to an unconfigured go-cve-dictionary, which errors out.
        # Drop these until `vuls0_old_ref` is bumped past the commits that
        # moved NVD, VulnCheck, JVN, Fortinet, Cisco and Palo Alto CPE
        # detection to vuls2.
        mkdir -p ./scan-results-old
        cp ./scan-results/*.json ./scan-results-old/
        rm -f \
          ./scan-results-old/windows_*.json \
          ./scan-results-old/cpe_*.json
        ls -1 ./scan-results-old

    - name: Diff detection with older vuls0 binary (baseline vs target DB)
      id: diff_detection_old
      # See note on diff_detection_master.
      continue-on-error: true
      shell: bash
      env:
        TARGET_DB: ${{ inputs.target_db }}
        FAMILY: ${{ steps.parse_thresholds.outputs.family }}
        LEGACY_THRESHOLD: ${{ steps.parse_thresholds.outputs.detection_legacy_threshold }}
        THRESHOLDS_CSV: ${{ steps.parse_thresholds.outputs.detection_thresholds_csv }}
        OVERRIDES_CSV: ${{ steps.parse_thresholds.outputs.detection_overrides_csv }}
        VULS0_OLD_REF: ${{ inputs.vuls0_old_ref }}
      run: |
        # Stay in `set +e` for the entire step. See note above.
        set +e
        set -o pipefail

        # See diff_detection_master for the verbatim-pass rationale.
        # Flag family chosen by the `Parse thresholds and overrides` step
        # from which inputs the caller gave (see the action description).
        case "$FAMILY" in
          legacy) set -- --change-rate-threshold "$LEGACY_THRESHOLD" --change-rate-threshold-override "$OVERRIDES_CSV" ;;
          *)      set -- --rate-threshold "$THRESHOLDS_CSV" --rate-threshold-override "$OVERRIDES_CSV" ;;
        esac
        vuls diff detection \
          ./scan-results-old \
          ./baseline.db "$VULS0_OLD" \
          "$TARGET_DB" "$VULS0_OLD" \
          "$@" \
          | tee ./diff-detection-old-report.md
        rc=$?

        echo "---" >> "$GITHUB_STEP_SUMMARY"
        echo "## Diff detection (older pinned vuls0 @${VULS0_OLD_REF:0:7}) — rc=${rc}" >> "$GITHUB_STEP_SUMMARY"
        # Shared excerpt rendering; see render-excerpt.sh.
        bash "${GITHUB_ACTION_PATH}/render-excerpt.sh" ./diff-detection-old-report.md 100 >> "$GITHUB_STEP_SUMMARY"
        # Defer failure to "Aggregate diff results" step. See note above.
        echo "rc=${rc}" >> "$GITHUB_OUTPUT"

    - name: Diff vuls.db against baseline
      id: diff_db
      # See note on diff_detection_master.
      continue-on-error: true
      shell: bash
      env:
        TARGET_DB: ${{ inputs.target_db }}
        FAMILY: ${{ steps.parse_thresholds.outputs.family }}
        LEGACY_THRESHOLD: ${{ steps.parse_thresholds.outputs.db_legacy_threshold }}
        THRESHOLDS_CSV: ${{ steps.parse_thresholds.outputs.db_thresholds_csv }}
        OVERRIDES_CSV: ${{ steps.parse_thresholds.outputs.db_overrides_csv }}
      run: |
        # Stay in `set +e` for the entire step. See note above.
        set +e
        set -o pipefail

        # See diff_detection_master for the verbatim-pass rationale.
        # Flag family chosen by the `Parse thresholds and overrides` step
        # from which inputs the caller gave (see the action description).
        case "$FAMILY" in
          legacy) set -- --change-rate-threshold "$LEGACY_THRESHOLD" --change-rate-threshold-override "$OVERRIDES_CSV" ;;
          *)      set -- --rate-threshold "$THRESHOLDS_CSV" --rate-threshold-override "$OVERRIDES_CSV" ;;
        esac
        vuls diff db ./baseline.db "$TARGET_DB" \
          "$@" \
          | tee ./diff-report.md
        rc=$?

        echo "---" >> "$GITHUB_STEP_SUMMARY"
        echo "## Diff vuls.db — rc=${rc}" >> "$GITHUB_STEP_SUMMARY"
        # Shared excerpt rendering; see render-excerpt.sh.
        bash "${GITHUB_ACTION_PATH}/render-excerpt.sh" ./diff-report.md 300 >> "$GITHUB_STEP_SUMMARY"
        # Defer failure to "Aggregate diff results" step. See note above.
        echo "rc=${rc}" >> "$GITHUB_OUTPUT"

    # See the action description for the full Failure-handling and
    # Exit-code policy. In short: every diff step has run by now and
    # written its rc (or left it MISSING if killed before recording).
    # This step turns the three rc values into a summary table and a
    # single exit code (first non-zero in step order).
    - name: Aggregate diff results
      shell: bash
      env:
        RC_DETECTION_MASTER: ${{ steps.diff_detection_master.outputs.rc }}
        RC_DETECTION_OLD: ${{ steps.diff_detection_old.outputs.rc }}
        RC_DB: ${{ steps.diff_db.outputs.rc }}
      run: |
        status() {
          case "$1" in
            "")  echo "MISSING" ;;
            "0") echo "PASS" ;;
            *)   echo "FAIL" ;;
          esac
        }
        label_master=$(status "${RC_DETECTION_MASTER}")
        label_old=$(status "${RC_DETECTION_OLD}")
        label_db=$(status "${RC_DB}")

        rc_master_disp="${RC_DETECTION_MASTER:-?}"
        rc_old_disp="${RC_DETECTION_OLD:-?}"
        rc_db_disp="${RC_DB:-?}"

        {
          echo "---"
          echo "## Diff guard summary"
          echo ""
          echo "| Check | rc | Status |"
          echo "| --- | --- | --- |"
          echo "| Diff detection (vuls0 master HEAD) | ${rc_master_disp} | ${label_master} |"
          echo "| Diff detection (older pinned vuls0) | ${rc_old_disp} | ${label_old} |"
          echo "| Diff vuls.db | ${rc_db_disp} | ${label_db} |"
        } >> "$GITHUB_STEP_SUMMARY"

        # Map a non-zero recorded rc to the action's exit code:
        # numeric 1..255 → pass through, anything else (empty MISSING,
        # non-numeric, > 255) → 1. The caller's loop only invokes this
        # for empty or non-zero rc, so 0 is unreachable here.
        pick_exit() {
          local v="$1"
          case "$v" in
            "" | *[!0-9]*) echo 1 ;;
            *) [ "$v" -le 255 ] && echo "$v" || echo 1 ;;
          esac
        }

        for rc in "${RC_DETECTION_MASTER}" "${RC_DETECTION_OLD}" "${RC_DB}"; do
          if [ "$rc" != "0" ]; then
            echo "diff guard failed: detection(master)=${rc_master_disp} detection(old)=${rc_old_disp} db=${rc_db_disp}" >&2
            exit "$(pick_exit "$rc")"
          fi
        done
