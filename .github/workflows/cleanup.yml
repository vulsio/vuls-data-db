name: Cleanup

run-name: "Cleanup untagged images in ${{ inputs.package }} by @${{ github.actor }}"

on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      package:
        required: true
        default: "vuls-data-db"
        type: choice
        options:
          - vuls-data-db
          - vuls-data-db-archive
          - vuls-data-db-backup

permissions: {}

jobs:
  cleanup:
    name: Cleanup untagged images in ${{ inputs.package }}
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - name: Set up Go 1.x
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: "stable"
          cache: false

      - name: Install vuls-data-update
        run: go install github.com/MaineK00n/vuls-data-update/cmd/vuls-data-update@main

      # The listing is a snapshot, and the deletes run for minutes after it. A
      # version that is untagged in the snapshot is not necessarily untagged when
      # its turn comes: a push in flight creates the version and tags it as
      # separate events, and nothing on the client or the registry side promises
      # a listing cannot fall between them. Deleting it then removes a tagged
      # version. That is how vuls-data-raw-redhat-repository-to-cpe vanished on
      # 2026-09-12.
      #
      # So leave anything created within the grace period alone; the next run
      # gets it. What a run orphans is the previous run's version, hours old, so
      # this defers nothing that matters.
      - name: Cleanup untagged images
        env:
          GRACE_SECONDS: 3600
        run: |
          set -euo pipefail

          vuls-data-update dotgit registry ls --repositories "ghcr.io/vulsio/${{ inputs.package }}" --token ${{ secrets.GITHUB_TOKEN }} \
            | jq -r --argjson grace "${GRACE_SECONDS}" '.[] | select(.name == "" and (.created_at | fromdateiso8601) < (now - $grace)) | .digest' \
            | xargs -r -I {} vuls-data-update dotgit registry delete --token ${{ secrets.GITHUB_TOKEN }} ghcr.io/vulsio/${{ inputs.package }}@{}
