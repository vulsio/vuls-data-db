name: Extract RedHat RHEL Only (CSAF, VEX)

run-name: "Extract vuls-data-extracted-${{ inputs.target }}-rhel@${{ inputs.branch }} by @${{ github.actor }}"

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      branch:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      target:
        required: true
        type: choice
        options:
          - redhat-csaf
          - redhat-vex-v1
          - redhat-vex-v2
      branch:
        required: true
        type: choice
        options:
          - main
          - nightly

permissions: {}

jobs:
  extract:
    name: Extract vuls-data-extracted-${{ inputs.target }}-rhel@${{ inputs.branch }}
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@90e01b21170618765a73370fcc3abbd1684a7793 # v5
        with:
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          remove-large-packages: "true"
          remove-cached-tools: "true"
          remove-swapfile: "true"

      - name: Set global git config
        run: |
          git config --global gc.auto 0
          git config --global maintenance.auto false
          git config --global init.defaultBranch main
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          repository: vulsio/filter-vuls-data-extracted-redhat
          ref: ${{ inputs.branch }}

      - name: Set up Go 1.x
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: "stable"
          cache: false

      - name: Install vuls-data-update
        run: go install github.com/MaineK00n/vuls-data-update/cmd/vuls-data-update@main

      - name: Pull ghcr.io/${{ github.repository }}:vuls-data-extracted-${{ inputs.target }}
        run: vuls-data-update dotgit pull --dir . --checkout ${{ inputs.branch }} --restore ghcr.io/${{ github.repository }}:vuls-data-extracted-${{ inputs.target }}

      - name: Pull ghcr.io/${{ github.repository }}:vuls-data-extracted-${{ inputs.target }}-rhel
        run: vuls-data-update dotgit pull --dir . --checkout ${{ inputs.branch }} ghcr.io/${{ github.repository }}:vuls-data-extracted-${{ inputs.target }}-rhel

      - name: Filter
        run: go run main.go ghcr.io/${{ github.repository }}/vuls-data-extracted-${{ inputs.target }} affected_repository_list.json ghcr.io/${{ github.repository }}/vuls-data-extracted-${{ inputs.target }}-rhel

      - name: Set Git remote
        run: |
          if git -C ghcr.io/${{ github.repository }}/vuls-data-extracted-${{ inputs.target }}-rhel remote | grep -q "^origin$"; then
            git -C ghcr.io/${{ github.repository }}/vuls-data-extracted-${{ inputs.target }}-rhel remote set-url origin ghcr.io/${{ github.repository }}:vuls-data-extracted-${{ inputs.target }}-rhel
          else
            git -C ghcr.io/${{ github.repository }}/vuls-data-extracted-${{ inputs.target }}-rhel remote add origin ghcr.io/${{ github.repository }}:vuls-data-extracted-${{ inputs.target }}-rhel
          fi

      # A run that writes nothing leaves the repository empty, and committing
      # that is a green run that quietly dropped the data. Stop before the
      # commit -- and before any restore, which would put the files back and
      # hide it.
      - name: Ensure the repository was left populated
        run: |
          set -euo pipefail

          if [[ -z $(find ghcr.io/${{ github.repository }}/vuls-data-extracted-${{ inputs.target }}-rhel -name .git -prune -o -type f -print -quit) ]]; then
            echo "::error::no files left on disk in ghcr.io/${{ github.repository }}/vuls-data-extracted-${{ inputs.target }}-rhel. refusing to commit an empty repository"
            exit 1
          fi

      - name: Commit
        run: |
          if [[ -n $(git -C ghcr.io/${{ github.repository }}/vuls-data-extracted-${{ inputs.target }}-rhel status --porcelain) ]]; then
            git -C ghcr.io/${{ github.repository }}/vuls-data-extracted-${{ inputs.target }}-rhel add .
            git -C ghcr.io/${{ github.repository }}/vuls-data-extracted-${{ inputs.target }}-rhel commit -m "update" -m "GitHub Actions: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/job/${{ job.check_run_id }}"
          fi

      - name: Create dotgit tarball
        run: vuls-data-update dotgit compress ghcr.io/${{ github.repository }}/vuls-data-extracted-${{ inputs.target }}-rhel

      - name: Push ghcr.io/${{ github.repository }}:vuls-data-extracted-${{ inputs.target }}-rhel
        run: vuls-data-update dotgit registry push --force --token ${{ secrets.GITHUB_TOKEN }} ghcr.io/${{ github.repository }}:vuls-data-extracted-${{ inputs.target }}-rhel vuls-data-extracted-${{ inputs.target }}-rhel.tar.zst
