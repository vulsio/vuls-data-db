name: Fetch Fedora

run-name: "Fetch vuls-data-raw-fedora-api by @${{ github.actor }}"

on:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  fedora-release:
    name: Fetch fedora release
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.fetch.outputs.release }}
    steps:
      - name: Fetch Release
        id: fetch
        run: |
          curl --parallel --parallel-immediate  --parallel-max 3 --retry 10 -o "#1.json" "https://bodhi.fedoraproject.org/releases/?page=[1-$(curl -s --retry 10 "https://bodhi.fedoraproject.org/releases/?page=1&rows_per_page=10" | jq .pages)]&rows_per_page=10"
          echo "release=$(cat *.json | jq -r '.releases[].name' | jq -R -s -c 'split("\n")[:-1]')" >> $GITHUB_OUTPUT

  pin:
    name: Pin MaineK00n/vuls-data-update main
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      revision: ${{ steps.resolve.outputs.revision }}
    steps:
      # Every shard and the commit build this one commit of vuls-data-update,
      # so the build the commit names is the one that fetched this run's
      # shards. A shard that checked out main for itself would pick up a
      # promotion that landed while the matrix ran -- its legs do not all start
      # at once -- and the shards would no longer agree on what fetched them.
      # A shard that fails leaves the data it last pushed, which an earlier run
      # fetched and committed, unless that run's commit failed too: then it is
      # first committed here, under this run's build.
      - name: Resolve main
        id: resolve
        run: |
          set -euo pipefail

          # Each shard used to resolve main inside actions/checkout, which
          # retries a fetch it fails, and a failure cost that shard alone. A
          # failure here costs every shard and the commit, so it is retried the
          # way go-install retries, and an attempt that hangs is cut off after a
          # minute and retried rather than holding them all for the six hours a
          # job may run.
          for ((i = 1; ; i++)); do
            if revision="$(timeout 60 git ls-remote --exit-code https://github.com/MaineK00n/vuls-data-update.git refs/heads/main | cut -f 1)" && [[ "${revision}" =~ ^[0-9a-f]{40}$ ]]; then
              break
            fi
            if ((i >= 5)); then
              echo "::error::main of MaineK00n/vuls-data-update did not resolve to a commit in ${i} attempts, last '${revision}'"
              exit 1
            fi
            echo "::warning::main of MaineK00n/vuls-data-update did not resolve to a commit (attempt ${i}/5). Retrying in $((i * 15))s"
            sleep $((i * 15))
          done
          echo "revision=${revision}" >> "${GITHUB_OUTPUT}"

  fetch:
    name: Fetch vuls-data-raw-fedora-api ${{ matrix.release }}
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    needs: [fedora-release, pin]
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJson(needs.fedora-release.outputs.release) }}
    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@90e01b21170618765a73370fcc3abbd1684a7793 # v5
        with:
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          remove-large-packages: "false"
          remove-cached-tools: "true"
          remove-swapfile: "true"

      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          repository: MaineK00n/vuls-data-update
          ref: ${{ needs.pin.outputs.revision }}

      - name: Set up Go 1.x
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: "go.mod"

      - name: Install vuls-data-update
        uses: vulsio/vuls-data-db/.github/actions/go-install@main
        with:
          package: ./cmd/vuls-data-update

      # A release can have no security update -- most container releases have
      # none -- so a shard can rightly fetch nothing. Since
      # MaineK00n/vuls-data-update#1033 the fetcher fails a run that wrote
      # nothing unless told otherwise. The commit job still runs and reuses the
      # last pushed fedora-data-<release> tag for a failed shard, but such a
      # shard would fail on every run, and a new release that is empty from
      # the start has no tag to pull, which fails the commit. The merged
      # repository is still checked as a whole there.
      - name: Fetch
        run: |
          mkdir vuls-data-raw-fedora-api
          vuls-data-update fetch fedora-api --dir vuls-data-raw-fedora-api --allow-empty ${{ matrix.release }} --retry 10

      - name: Create tarball
        run: tar --remove-files -acf vuls-data-raw-fedora-api.tar.zst vuls-data-raw-fedora-api || [[ $? == 1 ]]
      - name: Push ghcr.io/vulsio/vuls-data-db:fedora-data-${{ matrix.release }}
        run: vuls-data-update dotgit registry push --force --token ${{ secrets.GITHUB_TOKEN }} ghcr.io/vulsio/vuls-data-db:fedora-data-${{ matrix.release }} vuls-data-raw-fedora-api.tar.zst

  commit:
    name: Commit vuls-data-raw-fedora-api
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    if: ${{ (success() || failure()) && needs.pin.result == 'success' }}
    needs: [fedora-release, pin, fetch]
    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@90e01b21170618765a73370fcc3abbd1684a7793 # v5
        with:
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          remove-large-packages: "false"
          remove-cached-tools: "true"
          remove-swapfile: "true"

      - name: Set global git config
        run: |
          git config --global gc.auto 0
          git config --global maintenance.auto false
          git config --global init.defaultBranch main
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

      # Built from the commit the shards built, the way they built it, so the
      # build the commit names is the one that fetched this run's shards.
      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          repository: MaineK00n/vuls-data-update
          ref: ${{ needs.pin.outputs.revision }}

      - name: Set up Go 1.x
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: "go.mod"

      - name: Install vuls-data-update
        uses: vulsio/vuls-data-db/.github/actions/go-install@main
        with:
          package: ./cmd/vuls-data-update

      - name: Pull ghcr.io/${{ github.repository }}:vuls-data-raw-fedora-api
        run: vuls-data-update dotgit pull --dir . --checkout main ghcr.io/${{ github.repository }}:vuls-data-raw-fedora-api

      - name: Aggregate fedora-data-*
        run: |
          for release in $(echo '${{ needs.fedora-release.outputs.release }}' | jq -r '.[]'); do
            vuls-data-update dotgit pull --dir . --checkout "" ghcr.io/${{ github.repository }}:fedora-data-${release}
            if ls ghcr.io/${{ github.repository }}/fedora-data-${release}/* >/dev/null 2>&1; then
              mv ghcr.io/${{ github.repository }}/fedora-data-${release}/* ghcr.io/${{ github.repository }}/vuls-data-raw-fedora-api/ 
            fi
            rmdir ghcr.io/${{ github.repository }}/fedora-data-${release}
          done

      - name: Set Git remote
        run: |
          if git -C ghcr.io/${{ github.repository }}/vuls-data-raw-fedora-api remote | grep -q "^origin$"; then
            git -C ghcr.io/${{ github.repository }}/vuls-data-raw-fedora-api remote set-url origin ghcr.io/${{ github.repository }}:vuls-data-raw-fedora-api
          else
            git -C ghcr.io/${{ github.repository }}/vuls-data-raw-fedora-api remote add origin ghcr.io/${{ github.repository }}:vuls-data-raw-fedora-api
          fi

      # A run that writes nothing leaves the repository empty, and committing
      # that is a green run that quietly dropped the data. Stop before the
      # commit -- and before any restore, which would put the files back and
      # hide it.
      - name: Ensure the repository was left populated
        run: |
          set -euo pipefail

          if [[ -z $(find ghcr.io/${{ github.repository }}/vuls-data-raw-fedora-api -name .git -prune -o -type f -print -quit) ]]; then
            echo "::error::no files left on disk in ghcr.io/${{ github.repository }}/vuls-data-raw-fedora-api. refusing to commit an empty repository"
            exit 1
          fi

      - name: Commit
        uses: vulsio/vuls-data-db/.github/actions/commit@main
        with:
          dir: ghcr.io/${{ github.repository }}/vuls-data-raw-fedora-api
          check-run-id: ${{ job.check_run_id }}

      - name: Create dotgit tarball
        run: vuls-data-update dotgit compress ghcr.io/${{ github.repository }}/vuls-data-raw-fedora-api

      - name: Push ghcr.io/${{ github.repository }}:vuls-data-raw-fedora-api
        run: vuls-data-update dotgit registry push --force --token ${{ secrets.GITHUB_TOKEN }} ghcr.io/${{ github.repository }}:vuls-data-raw-fedora-api vuls-data-raw-fedora-api.tar.zst
