name: Git GC

run-name: "Git GC ${{ inputs.repository }}:${{ inputs.tag }} by @${{ github.actor }}"

on:
  workflow_call:
    inputs:
      repository:
        required: true
        type: string
      tag:
        required: true
        type: string
      pack-threads:
        required: true
        default: 2
        type: number
      pack-windowMemory:
        required: true
        default: 4g
        type: string
  workflow_dispatch:
    inputs:
      repository:
        required: true
        type: choice
        options:
          - vulsio/vuls-data-db
          - vulsio/vuls-data-db-archive
          - vulsio/vuls-data-db-backup
      tag:
        description: "e.g. vuls-data-raw-alpine-secdb"
        required: true
        type: string
      pack-threads:
        required: true
        default: 2
        type: number
      pack-windowMemory:
        required: true
        default: 4g
        type: string

permissions: {}

jobs:
  gc:
    name: Git GC ghcr.io/${{ inputs.repository }}:${{ inputs.tag }}
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@90e01b21170618765a73370fcc3abbd1684a7793 # v5
        with:
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          remove-large-packages: "false"
          remove-cached-tools: "true"
          remove-swapfile: "true"

      - name: Set global git config
        run: |
          git config --global gc.auto 0
          git config --global maintenance.auto false
          git config --global init.defaultBranch main
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

      - name: Set up Go 1.x
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: "stable"
          cache: false

      - name: Install vuls-data-update
        run: go install github.com/MaineK00n/vuls-data-update/cmd/vuls-data-update@main

      - name: Pull ghcr.io/${{ inputs.repository }}:${{ inputs.tag }}
        run: vuls-data-update dotgit pull --dir . --checkout main ghcr.io/${{ inputs.repository }}:${{ inputs.tag }}

      - name: Print git gc before .git size
        id: before
        run: echo "size=$(du -sh ghcr.io/${{ inputs.repository }}/${{ inputs.tag }}/.git/ | cut -f1)" >> $GITHUB_OUTPUT

      - name: Set Git config
        run: |
          git -C ghcr.io/${{ inputs.repository }}/${{ inputs.tag }} config pack.threads ${{ inputs.pack-threads }}
          git -C ghcr.io/${{ inputs.repository }}/${{ inputs.tag }} config pack.windowMemory ${{ inputs.pack-windowMemory }}

      - name: Run git gc
        run: /usr/bin/time -v git -C ghcr.io/${{ inputs.repository }}/${{ inputs.tag }} gc --aggressive --force

      - name: Print git gc after .git size
        id: after
        run: echo "size=$(du -sh ghcr.io/${{ inputs.repository }}/${{ inputs.tag }}/.git/ | cut -f1)" >> $GITHUB_OUTPUT

      - name: Summarize git gc
        run: |
          (
            echo ### git gc --aggressize ${{ inputs.tag }}
            echo "|      | before | after | "
            echo "| :--: | :----: | :---: | "
            echo "| size | ${{ steps.before.outputs.size }} | ${{ steps.after.outputs.size }} | "
          ) >> $GITHUB_STEP_SUMMARY

      - name: Create dotgit tarball
        run: vuls-data-update dotgit compress ghcr.io/${{ inputs.repository }}/${{ inputs.tag }}

      - name: Push ghcr.io/${{ inputs.repository }}:${{ inputs.tag }}
        run: vuls-data-update dotgit registry push --force --token ${{ secrets.GITHUB_TOKEN }} ghcr.io/${{ inputs.repository }}:${{ inputs.tag }} ${{ inputs.tag }}.tar.zst
