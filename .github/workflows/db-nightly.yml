name: DB(Nightly)

# Builds the nightly DB from db-nightly.lock.json in the lock repository
# (see db-guard.json): every source at the commit its per-source guard
# approved (guard-extracted.yml, run after each extract) or an operator set
# (approve.yml). There is no DB-side diff guard: each source was judged on
# its own before it entered the lock, so a DB built from the lock is
# published as is.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions: {}

# A build takes about two hours and also starts from approve.yml; one at a
# time, so a build of an older lock cannot finish last and move the tag back.
concurrency:
  group: db-nightly
  cancel-in-progress: false

jobs:
  build:
    name: build vuls.db
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    env:
      DB: nightly
      REPOSITORY: ghcr.io/vulsio/vuls-nightly-db
    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@90e01b21170618765a73370fcc3abbd1684a7793 # v5
        with:
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          remove-large-packages: "false"
          remove-cached-tools: "true"
          remove-swapfile: "true"

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Read DB config
        id: config
        run: |
          set -euo pipefail
          # Without a tag the DB would be pushed and left untagged in a
          # green run, so a missing or empty list stops the build here.
          tags=$(jq -er --arg db "${DB}" '.dbs[$db].tags | select(length > 0) | join(" ")' db-guard.json) || {
            echo "::error::db-guard.json .dbs.${DB}.tags is missing or empty"
            exit 1
          }
          {
            echo "lock_repository=$(jq -r '.lock_repository' db-guard.json)"
            echo "vuls2=$(jq -r --arg db "${DB}" '.dbs[$db].vuls2' db-guard.json)"
            echo "tags=${tags}"
          } >> "$GITHUB_OUTPUT"

      - name: Check out lock repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          repository: ${{ steps.config.outputs.lock_repository }}
          path: lock

      - name: Set up Go 1.x
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: "stable"
          cache: false

      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y jq zstd

      - name: Install vuls-data-update
        run: go install github.com/MaineK00n/vuls-data-update/cmd/vuls-data-update@nightly

      - name: Install vuls
        run: go install "github.com/MaineK00n/vuls2/cmd/vuls@${{ steps.config.outputs.vuls2 }}"

      # Concurrency is set explicitly rather than left to the defaults
      # (download: number of CPUs), so a different runner does not change
      # how much is on disk at once: every dotgit (.git only, 5.4 GB in
      # all) plus at most restore+1 extracted trees (suse-oval is 8.5 GB).
      - name: Build DB
        run: vuls db build --lock "lock/db-${DB}.lock.json" --dbpath ./vuls.db --report ./report.json --dir ./work --download-concurrency 4 --restore-concurrency 1

      - name: Compact vuls.db
        run: vuls db compress --dbpath ./vuls.db

      - name: Push vuls.db to GHCR
        id: push
        run: |
          set -euo pipefail
          digest=$(vuls db push --token "${{ secrets.GITHUB_TOKEN }}" "${REPOSITORY}" ./vuls.db.zst)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Tag the pushed digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.config.outputs.tags }}
        run: |
          set -euo pipefail
          for tag in ${TAGS}; do
            vuls-data-update dotgit registry tag --token "${{ secrets.GITHUB_TOKEN }}" "${REPOSITORY}@${DIGEST}" "${tag}"
          done

      # Which lock the DB was built from, and how far each source's lock
      # commit is behind its branch. The age is counted from the first
      # commit after the lock's (when the source started waiting), not from
      # the branch head, which would overstate rarely updated sources and
      # not grow for sources whose upstream stopped.
      - name: Write summary
        if: ${{ success() || failure() }}
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.config.outputs.tags }}
          LOCK_REPOSITORY: ${{ steps.config.outputs.lock_repository }}
        run: |
          set -euo pipefail
          lock_commit=$(git -C lock rev-parse HEAD 2>/dev/null || echo unknown)
          {
            echo "## DB(${DB})"
            echo '```text'
            echo "lock       : https://github.com/${LOCK_REPOSITORY}/blob/${lock_commit}/db-${DB}.lock.json"
            if [ -n "${DIGEST}" ]; then
              echo "digest ref : ${REPOSITORY}@${DIGEST}"
              echo "tags       : ${TAGS}"
            fi
            echo '```'
            if [ -s ./report.json ]; then
              echo "built with $(jq -r '.vuls_version' ./report.json)"
              echo ""
              echo "| source | lock commit | branch head | behind | waiting (days) |"
              echo "| --- | --- | --- | ---: | ---: |"
              jq -r --argjson now "$(date +%s)" '.sources[] | "| \(.name) | \(.commit[0:12]) | \(.branch_head[0:12]) | \(.behind) | \(if .next_commit_date then (($now - (.next_commit_date | fromdateiso8601)) / 86400 | floor) else "" end) |"' ./report.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  action-run-summary:
    name: Action run summary
    if: ${{ success() || failure() }}
    needs: [build]
    uses: ./.github/workflows/action-run-summary.yml
    permissions:
      contents: read
      actions: read
