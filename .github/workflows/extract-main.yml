name: Extract Main

run-name: "Extract vuls-data-extracted-${{ inputs.target }}@${{ inputs.branch }} by @${{ github.actor }}"

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      branch:
        required: true
        type: string
    secrets:
      LOCK_DEPLOY_KEY:
        description: Deploy key of the lock repository, for the guard (see guard-extracted.yml).
        required: false
  workflow_dispatch:
    inputs:
      target:
        required: true
        type: choice
        options:
          - alma-errata
          - alma-osv
          # - alma-oval
          # - alma-updateinfo
          - alpine-secdb
          - alpine-osv
          - amazon
          # - android-osv
          - apple-security-releases
          - arch
          # - bitnami-osv
          # - cargo-ghsa
          # - cargo-osv
          # - cargo-db
          # - chainguard-osv
          - cisa-kev
          - cisco-json
          # - composer-ghsa
          # - composer-glsa
          # - composer-osv
          # - composer-db
          # - conan-glsa
          # - debian-osv
          # - debian-oval
          # - debian-security-tracker-api
          - debian-security-tracker-salsa
          - enisa-euvd-list
          - enisa-kev
          - epss
          # - erlang-ghsa
          # - erlang-osv
          - exploit-exploitdb
          - exploit-github
          - exploit-inthewild
          - exploit-trickest
          - fedora-api
          # - fedora-updateinfo
          # - fortinet-handmade
          - fortinet-csaf
          - fortinet-cvrf
          - freebsd
          # - gentoo
          # - ghactions-osv
          # - git-osv
          # - golang-ghsa
          # - golang-glsa
          # - golang-osv
          # - golang-db
          # - golang-vulndb
          # - haskell-ghc-osv
          # - haskell-hackage-osv
          - jvn-feed-detail
          # - jvn-feed-product
          - jvn-feed-rss
          # - linux-osv
          # - maven-ghsa
          # - maven-glsa
          # - maven-osv
          - microsoft-bulletin
          - microsoft-cvrf
          - microsoft-msuc
          - microsoft-servicing
          - microsoft-wsusscn2
          - mitre-attack
          - mitre-capec
          # - mitre-cve-cvrf
          # - mitre-cve-v4
          - mitre-cve-v5
          - mitre-cwe
          # - mitre-emb3d
          - msf
          # - netbsd
          # - npm-ghsa
          # - npm-glsa
          # - npm-osv
          # - npm-db
          # - nuget-ghsa
          # - nuget-glsa
          # - nuget-osv
          - nuclei-repository
          # - nvd-api-cpe
          # - nvd-feed-cve-v1
          # - nvd-feed-cpe-v1
          # - nvd-feed-cpematch-v1
          # - nvd-feed-cve-v2
          # - nvd-feed-cpe-v2
          # - nvd-feed-cpematch-v2
          # - openssh-security
          # - openssl-secjson
          - oracle-linux
          # - oss-fuzz-osv
          - paloalto-json
          # - perl-db
          # - pip-ghsa
          # - pip-glsa
          # - pip-osv
          # - pip-db
          # - pub-ghsa
          # - pub-osv
          # - r-osv
          - redhat-cve
          # - redhat-cvrf
          # - redhat-osv
          - rocky-errata
          # - rocky-osv
          # - rocky-updateinfo
          # - rubygems-ghsa
          # - rubygems-glsa
          # - rubygems-osv
          # - rubygems-db
          # - snort
          - suse-oval
          # - suse-cvrf
          # - suse-cvrf-cve
          # - suse-csaf
          # - suse-csaf-vex
          # - suse-osv
          # - swift-ghsa
          # - swift-osv
          # - ubuntu-oval
          - ubuntu-cve-tracker
          # - ubuntu-osv
          # - ubuntu-vex
          - vulncheck-kev
          - vulncheck-nist-nvd2
          # - wolfi-osv
      branch:
        required: true
        type: choice
        options:
          - main
          - nightly

permissions: {}

jobs:
  extract:
    name: Extract vuls-data-extracted-${{ inputs.target }}@${{ inputs.branch }}
    permissions:
      contents: read
      packages: write
    # main and nightly live in the same image and the extract force-pushes
    # the whole .git, so extracts of one image run one at a time.
    concurrency:
      group: extract-${{ inputs.target }}
      cancel-in-progress: false
    outputs:
      commit: ${{ steps.head.outputs.commit }}
    runs-on: ubuntu-latest
    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@90e01b21170618765a73370fcc3abbd1684a7793 # v5
        with:
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          remove-large-packages: "false"
          remove-cached-tools: "true"
          remove-swapfile: "true"

      - name: Set global git config
        run: |
          git config --global gc.auto 0
          git config --global maintenance.auto false
          git config --global init.defaultBranch main
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          repository: MaineK00n/vuls-data-update
          ref: ${{ inputs.branch }}

      - name: Set up Go 1.x
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: "go.mod"

      - name: Install vuls-data-update
        run: go install ./cmd/vuls-data-update

      - name: Pull ghcr.io/${{ github.repository }}:vuls-data-raw-${{ inputs.target }}
        run: vuls-data-update dotgit pull --dir . --checkout main --restore ghcr.io/${{ github.repository }}:vuls-data-raw-${{ inputs.target }}

      - name: Pull ghcr.io/${{ github.repository }}:vuls-data-extracted-${{ inputs.target }}
        run: vuls-data-update dotgit pull --dir . --checkout ${{ inputs.branch }} ghcr.io/${{ github.repository }}:vuls-data-extracted-${{ inputs.target }}

      - name: Extract
        run: vuls-data-update extract ${{ inputs.target }} --dir ghcr.io/${{ github.repository }}/vuls-data-extracted-${{ inputs.target }} ghcr.io/${{ github.repository }}/vuls-data-raw-${{ inputs.target }}

      - name: Set Git remote
        run: |
          if git -C ghcr.io/${{ github.repository }}/vuls-data-extracted-${{ inputs.target }} remote | grep -q "^origin$"; then
            git -C ghcr.io/${{ github.repository }}/vuls-data-extracted-${{ inputs.target }} remote set-url origin ghcr.io/${{ github.repository }}:vuls-data-extracted-${{ inputs.target }}
          else
            git -C ghcr.io/${{ github.repository }}/vuls-data-extracted-${{ inputs.target }} remote add origin ghcr.io/${{ github.repository }}:vuls-data-extracted-${{ inputs.target }}
          fi

      # A run that writes nothing leaves the repository empty, and committing
      # that is a green run that quietly dropped the data. Stop before the
      # commit -- and before any restore, which would put the files back and
      # hide it.
      - name: Ensure the repository was left populated
        run: |
          set -euo pipefail

          if [[ -z $(find ghcr.io/${{ github.repository }}/vuls-data-extracted-${{ inputs.target }} -name .git -prune -o -type f -print -quit) ]]; then
            echo "::error::no files left on disk in ghcr.io/${{ github.repository }}/vuls-data-extracted-${{ inputs.target }}. refusing to commit an empty repository"
            exit 1
          fi

      - name: Commit
        run: |
          if [[ -n $(git -C ghcr.io/${{ github.repository }}/vuls-data-extracted-${{ inputs.target }} status --porcelain) ]]; then
            git -C ghcr.io/${{ github.repository }}/vuls-data-extracted-${{ inputs.target }} add .
            git -C ghcr.io/${{ github.repository }}/vuls-data-extracted-${{ inputs.target }} commit -m "update" -m "GitHub Actions: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/job/${{ job.check_run_id }}"
          fi

      - name: Create dotgit tarball
        run: vuls-data-update dotgit compress ghcr.io/${{ github.repository }}/vuls-data-extracted-${{ inputs.target }}

      - name: Push ghcr.io/${{ github.repository }}:vuls-data-extracted-${{ inputs.target }}
        run: vuls-data-update dotgit registry push --force --token ${{ secrets.GITHUB_TOKEN }} ghcr.io/${{ github.repository }}:vuls-data-extracted-${{ inputs.target }} vuls-data-extracted-${{ inputs.target }}.tar.zst

      # The guard compares the lock's commit with this one; it is output
      # even when the run made no commit, so a source whose last guard
      # failed is judged again.
      - name: Record the extracted head
        id: head
        run: echo "commit=$(git -C ghcr.io/${{ github.repository }}/vuls-data-extracted-${{ inputs.target }} rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  guard:
    name: guard ${{ inputs.target }}@${{ inputs.branch }}
    needs: extract
    if: ${{ inputs.branch == 'nightly' }}
    # One guard per source and branch at a time, in extract order: a newer
    # guard waits for the running one, and a waiting older one is replaced
    # by a newer, so an older candidate is never judged against a lock a
    # newer guard has already moved (which would roll the row back).
    concurrency:
      group: guard-${{ inputs.target }}-${{ inputs.branch }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/guard-extracted.yml
    with:
      name: ${{ inputs.target }}
      branch: ${{ inputs.branch }}
      commit: ${{ needs.extract.outputs.commit }}
    secrets:
      LOCK_DEPLOY_KEY: ${{ secrets.LOCK_DEPLOY_KEY }}
