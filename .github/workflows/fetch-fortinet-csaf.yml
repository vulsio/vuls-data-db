name: Fetch Fortinet CSAF

run-name: "Fetch vuls-data-raw-fortinet-csaf${{ inputs.fetch_all && ' (all)' || '' }} by @${{ github.actor }}"

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      fetch_all:
        description: "Fetch all Fortinet CSAF"
        required: true
        default: false
        type: boolean

permissions: {}

jobs:
  check:
    name: Decide whether to fetch all
    runs-on: ubuntu-latest
    outputs:
      do_fetch_all: ${{ steps.check.outputs.fetch_all }}
    steps:
      - name: Check if fetch_all
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "fetch_all=${{ inputs.fetch_all }}" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [[ $(( ${{ github.run_number }} % 15 )) -eq 0 ]]; then
            echo "fetch_all=true" >> $GITHUB_OUTPUT
          fi

  fetch:
    name: Fetch vuls-data-raw-fortinet-csaf
    needs: check
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@90e01b21170618765a73370fcc3abbd1684a7793 # v5
        with:
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          remove-large-packages: "true"
          remove-cached-tools: "true"
          remove-swapfile: "true"

      - name: Set global git config
        run: |
          git config --global gc.auto 0
          git config --global maintenance.auto false
          git config --global init.defaultBranch main
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          repository: MaineK00n/vuls-data-update
          ref: main

      - name: Set up Go 1.x
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: "go.mod"

      - name: Install vuls-data-update
        run: go install ./cmd/vuls-data-update

      - name: Install xq
        run: go install github.com/sibprogrammer/xq@v1.4.0

      - name: Pull ghcr.io/${{ github.repository }}:vuls-data-raw-fortinet-csaf
        run: vuls-data-update dotgit pull --dir . --checkout main --restore ghcr.io/${{ github.repository }}:vuls-data-raw-fortinet-csaf

      - name: Fetch All
        if: ${{ needs.check.outputs.do_fetch_all == 'true' }}
        run: vuls-data-update fetch fortinet-csaf --dir ghcr.io/${{ github.repository }}/vuls-data-raw-fortinet-csaf --concurrency 1 --wait 3s $(sort <(curl https://filestore.fortinet.com/fortiguard/rss/ir.xml | xq -x //item/link | xargs -L 1 basename | grep '^FG-IR-') <(find ghcr.io/${{ github.repository }}/vuls-data-raw-fortinet-csaf/ -name "*.json" | xargs -I {} sh -c "basename {} .json") | uniq | tr '\n' ' ')

      - name: Fetch RSS
        if: ${{ needs.check.outputs.do_fetch_all != 'true' }}
        run: |
          vuls-data-update fetch fortinet-csaf --dir ghcr.io/${{ github.repository }}/vuls-data-raw-fortinet-csaf --concurrency 1 $(curl https://filestore.fortinet.com/fortiguard/rss/ir.xml | xq -x //item/link | xargs -L 1 basename | grep '^FG-IR-' | tr '\n' ' ')

      # The fetch empties the tree before it writes, so whatever it fails to
      # write back reads as a deletion -- and the advisory list it fetches is
      # seeded from the files already on disk, so a dropped file also drops out
      # of every later seed and never comes back on its own. This ran only on
      # the RSS side until run 32317321410, which left the fetch-all side free
      # to commit whatever it happened to lose: one advisory at a time from
      # 2026-01-22 on, then all 181 at once when the advisory pages started
      # answering with an interstitial. None of those advisories had actually
      # been withdrawn: FG-IR-25-260 was dropped by the fetch-all run on
      # 2026-04-07 and refetched by an RSS run the same day. So restore on both
      # sides. An advisory upstream really does withdraw is rare enough to
      # remove by hand.
      - name: Restore all deleted files
        run: |
          deleted=$(git -C ghcr.io/${{ github.repository }}/vuls-data-raw-fortinet-csaf ls-files --deleted)
          if [[ -n "${deleted}" ]]; then
            git -C ghcr.io/${{ github.repository }}/vuls-data-raw-fortinet-csaf restore -- ${deleted}
          fi

      - name: Set Git remote
        run: |
          if git -C ghcr.io/${{ github.repository }}/vuls-data-raw-fortinet-csaf remote | grep -q "^origin$"; then
            git -C ghcr.io/${{ github.repository }}/vuls-data-raw-fortinet-csaf remote set-url origin ghcr.io/${{ github.repository }}:vuls-data-raw-fortinet-csaf
          else
            git -C ghcr.io/${{ github.repository }}/vuls-data-raw-fortinet-csaf remote add origin ghcr.io/${{ github.repository }}:vuls-data-raw-fortinet-csaf
          fi

      - name: Commit
        run: |
          if [[ -n $(git -C ghcr.io/${{ github.repository }}/vuls-data-raw-fortinet-csaf status --porcelain) ]]; then
            git -C ghcr.io/${{ github.repository }}/vuls-data-raw-fortinet-csaf add .
            git -C ghcr.io/${{ github.repository }}/vuls-data-raw-fortinet-csaf commit -m "update" -m "GitHub Actions: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/job/${{ job.check_run_id }}"
          fi

      - name: Create dotgit tarball
        run: vuls-data-update dotgit compress ghcr.io/${{ github.repository }}/vuls-data-raw-fortinet-csaf

      - name: Push ghcr.io/${{ github.repository }}:vuls-data-raw-fortinet-csaf
        run: vuls-data-update dotgit registry push --force --token ${{ secrets.GITHUB_TOKEN }} ghcr.io/${{ github.repository }}:vuls-data-raw-fortinet-csaf vuls-data-raw-fortinet-csaf.tar.zst
