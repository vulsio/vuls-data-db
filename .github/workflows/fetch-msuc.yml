name: Fetch MSUC

run-name: "Fetch vuls-data-raw-microsoft-msuc by @${{ github.actor }}"

on:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  list-names:
    name: List MSUC target names
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      include: ${{ steps.list.outputs.include }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - id: list
        run: |
          include="$(jq -c . .github/workflows/msuc-targets.json)"
          echo "include=${include}" >> "$GITHUB_OUTPUT"

  fetch:
    name: Fetch vuls-data-raw-microsoft-msuc ${{ matrix.name }}
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    needs: [list-names]
    strategy:
      fail-fast: false
      # Legs come back empty across runners at once, so what the catalog
      # throttles on is the rate the whole matrix adds up to rather than any
      # one runner's. 5 is what the matrix already averaged, so capping there
      # trims its peak of 10 without lengthening the run. Read with `--wait`
      # below: the rate is the product of the two. `git blame` for the run
      # both were measured on.
      max-parallel: 5
      matrix:
        include: ${{ fromJson(needs.list-names.outputs.include) }}
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@90e01b21170618765a73370fcc3abbd1684a7793 # v5
        with:
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          remove-large-packages: "true"
          remove-cached-tools: "true"
          remove-swapfile: "true"

      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          repository: MaineK00n/vuls-data-update
          ref: main

      - name: Set up Go 1.x
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: "go.mod"

      - name: Install vuls-data-update
        run: go install ./cmd/vuls-data-update

      # `--wait` is the pause each worker takes after its own request, so a leg
      # asks at concurrency/(latency + wait) per second: 2s takes a leg from
      # ~3.7/s to ~2.1/s, and the matrix of 5 from ~37/s to ~11/s. Changing
      # either this or max-parallel moves that product, so weigh them together.
      - name: Fetch
        run: |
          mkdir vuls-data-raw-microsoft-msuc
          vuls-data-update fetch microsoft-msuc --dir vuls-data-raw-microsoft-msuc --wait 2s ${{ join(matrix.target, ' ') }}

      - name: Create tarball
        run: tar --remove-files -acf vuls-data-raw-microsoft-msuc.tar.zst vuls-data-raw-microsoft-msuc || [[ $? == 1 ]]

      - name: Push ghcr.io/vulsio/vuls-data-db:microsoft-msuc-data-${{ matrix.name }}
        run: vuls-data-update dotgit registry push --force --token ${{ secrets.GITHUB_TOKEN }} ghcr.io/vulsio/vuls-data-db:microsoft-msuc-data-${{ matrix.name }} vuls-data-raw-microsoft-msuc.tar.zst

  commit:
    name: Commit vuls-data-raw-microsoft-msuc
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    if: ${{ success() || failure() }}
    needs: [list-names, fetch]
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@90e01b21170618765a73370fcc3abbd1684a7793 # v5
        with:
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          remove-large-packages: "true"
          remove-cached-tools: "true"
          remove-swapfile: "true"

      - name: Set global git config
        run: |
          git config --global gc.auto 0
          git config --global maintenance.auto false
          git config --global init.defaultBranch main
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

      - name: Set up Go 1.x
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: "stable"
          cache: false

      - name: Install vuls-data-update
        run: go install github.com/MaineK00n/vuls-data-update/cmd/vuls-data-update@main

      - name: Pull ghcr.io/${{ github.repository }}:vuls-data-raw-microsoft-msuc
        run: vuls-data-update dotgit pull --dir . --checkout main ghcr.io/${{ github.repository }}:vuls-data-raw-microsoft-msuc

      - name: Aggregate microsoft-msuc-data-*
        env:
          # Filtered by the expression engine and read from the environment,
          # rather than interpolated into the script: the expression is
          # substituted before bash parses it, so an apostrophe in a group
          # comment ended the quoted string and bash ran the rest of the JSON
          # as commands. The names are also all this step needs, and all that
          # fits: include is 161442 bytes and grows, while one environment
          # string is capped at MAX_ARG_STRLEN, 32 pages or 131072 bytes,
          # counting the NAME= and the terminator. Measured on a runner-like
          # box: 131004 passes, 131075 gives "Argument list too long". That is
          # the per-string cap, not the ARG_MAX total, which is 2 MB here.
          NAMES: ${{ toJson(fromJson(needs.list-names.outputs.include).*.name) }}
        run: |
          # Read out first, and only from a non-empty array: "[]" is not an
          # empty string, jq -e exits 0 on empty input, jq length counts a
          # string or an object too, and an error inside < <(...) does not fail
          # the step -- so every one of those would leave the loop running zero
          # times and the step green having aggregated nothing.
          names="$(jq -er 'if type == "array" and length > 0 then .[] else error("not a non-empty array") end' <<< "${NAMES}" || true)"
          if [[ -z "${names}" ]]; then
            echo "::error::no shard names in the list-names output"
            exit 1
          fi
          while read -r name; do
            vuls-data-update dotgit pull --dir . --checkout "" "ghcr.io/${{ github.repository }}:microsoft-msuc-data-${name}"
            if ls "ghcr.io/${{ github.repository }}/microsoft-msuc-data-${name}/"* >/dev/null 2>&1; then
              mv "ghcr.io/${{ github.repository }}/microsoft-msuc-data-${name}/"* "ghcr.io/${{ github.repository }}/vuls-data-raw-microsoft-msuc/"
            fi
            rmdir "ghcr.io/${{ github.repository }}/microsoft-msuc-data-${name}"
          done <<< "${names}"

      - name: Set Git remote
        run: |
          if git -C ghcr.io/${{ github.repository }}/vuls-data-raw-microsoft-msuc remote | grep -q "^origin$"; then
            git -C ghcr.io/${{ github.repository }}/vuls-data-raw-microsoft-msuc remote set-url origin ghcr.io/${{ github.repository }}:vuls-data-raw-microsoft-msuc
          else
            git -C ghcr.io/${{ github.repository }}/vuls-data-raw-microsoft-msuc remote add origin ghcr.io/${{ github.repository }}:vuls-data-raw-microsoft-msuc
          fi

      - name: Commit
        run: |
          if [[ -n $(git -C ghcr.io/${{ github.repository }}/vuls-data-raw-microsoft-msuc status --porcelain) ]]; then
            git -C ghcr.io/${{ github.repository }}/vuls-data-raw-microsoft-msuc add .
            git -C ghcr.io/${{ github.repository }}/vuls-data-raw-microsoft-msuc commit -m "update" -m "GitHub Actions: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/job/${{ job.check_run_id }}"
          fi

      - name: Create dotgit tarball
        run: vuls-data-update dotgit compress ghcr.io/${{ github.repository }}/vuls-data-raw-microsoft-msuc

      - name: Push ghcr.io/${{ github.repository }}:vuls-data-raw-microsoft-msuc
        run: vuls-data-update dotgit registry push --force --token ${{ secrets.GITHUB_TOKEN }} ghcr.io/${{ github.repository }}:vuls-data-raw-microsoft-msuc vuls-data-raw-microsoft-msuc.tar.zst

