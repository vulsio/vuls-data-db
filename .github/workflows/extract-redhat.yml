name: Extract RedHat

run-name: "Extract vuls-data-extracted-${{ inputs.target }}@${{ inputs.branch }} and its -rhel by @${{ github.actor }}"

# Extracts a Red Hat source with extract-main.yml and derives
# vuls-data-extracted-<target>-rhel from it: the OVALv2 one is extracted again
# from the raw repositories, and the CSAF and VEX ones are filtered out of what
# the extract just pushed.

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      branch:
        required: true
        type: string
      reads:
        description: Other raw sources the extractor takes after the target's own, space-separated
        required: true
        type: string
    outputs:
      committed:
        description: Whether the extract committed a change to the branch of vuls-data-extracted-<target>
        value: ${{ jobs.extract.outputs.committed }}
      rhel-committed:
        description: Whether the derivation committed a change to the branch of vuls-data-extracted-<target>-rhel
        value: ${{ jobs.rhel-oval.outputs.committed || jobs.rhel.outputs.committed }}
  workflow_dispatch:
    inputs:
      target:
        required: true
        type: choice
        options:
          - redhat-oval-v2
          - redhat-csaf
          - redhat-vex-v1
          - redhat-vex-v2
      branch:
        required: true
        type: choice
        options:
          - main
          - nightly
      reads:
        description: Other raw sources the extractor takes after the target's own, space-separated
        required: true
        default: redhat-repository-to-cpe
        type: string

permissions: {}

jobs:
  extract:
    name: Extract vuls-data-extracted-${{ inputs.target }}@${{ inputs.branch }}
    uses: ./.github/workflows/extract-main.yml
    permissions:
      contents: read
      packages: write
    with:
      target: ${{ inputs.target }}
      branch: ${{ inputs.branch }}
      reads: ${{ inputs.reads }}

  # Reads the raw repositories rather than the extract above, so it need not
  # wait for it.
  rhel-oval:
    name: Extract vuls-data-extracted-${{ inputs.target }}-rhel@${{ inputs.branch }}
    if: ${{ inputs.target == 'redhat-oval-v2' }}
    uses: ./.github/workflows/extract-redhat-rhel-oval-v2.yml
    permissions:
      contents: read
      packages: write
    with:
      branch: ${{ inputs.branch }}

  # Filters what the extract above pushed, or what the tag already held if it
  # failed.
  rhel:
    name: Extract vuls-data-extracted-${{ inputs.target }}-rhel@${{ inputs.branch }}
    needs: [extract]
    if: ${{ !cancelled() && contains(fromJSON('["redhat-csaf", "redhat-vex-v1", "redhat-vex-v2"]'), inputs.target) }}
    uses: ./.github/workflows/extract-redhat-rhel-csaf-or-vex.yml
    permissions:
      contents: read
      packages: write
    with:
      target: ${{ inputs.target }}
      branch: ${{ inputs.branch }}
