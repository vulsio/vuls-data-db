name: Restore

run-name: "Restore ${{ inputs.repository }}:${{ inputs.tag }}-${{ inputs.tag-suffix }} -> ${{ github.repository }}:${{ inputs.tag }} by @${{ github.actor }}"

on:
  workflow_call:
    inputs:
      repository:
        required: true
        type: string
      tag:
        required: true
        type: string
      tag-suffix:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      repository:
        required: true
        default: "vulsio/vuls-data-db-backup"
        type: string
      tag:
        required: true
        type: string
      tag-suffix:
        required: true
        default: "backup-manual"
        type: choice
        options:
          - backup-manual
          - backup-daily
          - backup-weekly
          - backup-monthly

permissions: {}

jobs:
  restore:
    name: Restore ghcr.io/${{ inputs.repository }}:${{ inputs.tag }}-${{ inputs.tag-suffix }} to ghcr.io/${{ github.repository }}:${{ inputs.tag }}
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@90e01b21170618765a73370fcc3abbd1684a7793 # v5
        with:
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          remove-large-packages: "false"
          remove-cached-tools: "true"
          remove-swapfile: "true"

      - name: Set up Go 1.x
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v6
        with:
          go-version: "stable"
          cache: false

      - name: Install vuls-data-update
        uses: vulsio/vuls-data-db/.github/actions/go-install@main
        with:
          package: github.com/MaineK00n/vuls-data-update/cmd/vuls-data-update@main

      - name: Copy ghcr.io/${{ inputs.repository }}:${{ inputs.tag }}-${{ inputs.tag-suffix }} to ghcr.io/${{ github.repository }}:${{ inputs.tag }}
        run: vuls-data-update dotgit registry cp --force --token ${{ secrets.GITHUB_TOKEN }} ghcr.io/${{ inputs.repository }}:${{ inputs.tag }}-${{ inputs.tag-suffix }} ghcr.io/${{ github.repository }}:${{ inputs.tag }}
