name: Restore All

run-name: "Restore All (${{ inputs.tag-suffix }}) by @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      tag-suffix:
        required: true
        default: "backup-manual"
        type: choice
        options:
          - backup-manual
          - backup-daily
          - backup-weekly
          - backup-monthly

permissions: {}

jobs:
  plan:
    name: List the repositories in sources.json
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      raw: ${{ steps.list.outputs.raw }}
      extracted: ${{ steps.list.outputs.extracted }}
    steps:
      - name: Check out sources.json
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          sparse-checkout: .github/workflows/sources.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # The repositories Backup All backs up.
      - name: List the repositories
        id: list
        run: |
          set -euo pipefail

          {
            echo "raw=$(jq -c 'map(select(.fetch != "none") | "vuls-data-raw-\(.name)")' .github/workflows/sources.json)"
            echo "extracted=$(jq -c 'map(select(.extract) | "vuls-data-extracted-\(.name)") + map(select(.rhel) | "vuls-data-extracted-\(.name)-rhel")' .github/workflows/sources.json)"
          } >> "$GITHUB_OUTPUT"

  # A matrix holds at most 256 jobs, so the raw and the extracted repositories
  # get one each.
  restore-raw:
    name: Restore ${{ matrix.tag }}
    needs: [plan]
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.plan.outputs.raw) }}
    uses: ./.github/workflows/restore.yml
    permissions:
      contents: read
      packages: write
    with:
      repository: vulsio/vuls-data-db-backup
      tag: ${{ matrix.tag }}
      tag-suffix: ${{ inputs.tag-suffix }}

  restore-extracted:
    name: Restore ${{ matrix.tag }}
    needs: [plan]
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.plan.outputs.extracted) }}
    uses: ./.github/workflows/restore.yml
    permissions:
      contents: read
      packages: write
    with:
      repository: vulsio/vuls-data-db-backup
      tag: ${{ matrix.tag }}
      tag-suffix: ${{ inputs.tag-suffix }}
