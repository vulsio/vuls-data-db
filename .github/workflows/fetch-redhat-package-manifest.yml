name: Fetch RedHat Package Manifest

run-name: "Fetch vuls-data-raw-redhat-package-manifest by @${{ github.actor }}"

on:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  fetch:
    name: Fetch vuls-data-raw-redhat-package-manifest
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@90e01b21170618765a73370fcc3abbd1684a7793 # v5
        with:
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          remove-large-packages: "false"
          remove-cached-tools: "true"
          remove-swapfile: "true"

      - name: Set global git config
        run: |
          git config --global gc.auto 0
          git config --global maintenance.auto false
          git config --global init.defaultBranch main
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          repository: MaineK00n/vuls-data-update
          ref: main

      - name: Set up Go 1.x
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: "go.mod"

      - name: Install vuls-data-update
        uses: vulsio/vuls-data-db/.github/actions/go-install@main
        with:
          package: ./cmd/vuls-data-update

      - name: Pull ghcr.io/${{ github.repository }}:vuls-data-raw-redhat-package-manifest
        run: vuls-data-update dotgit pull --dir . --checkout main ghcr.io/${{ github.repository }}:vuls-data-raw-redhat-package-manifest

      # docs.redhat.com refuses CI, so the pages are saved by hand and kept in
      # origin/ of the raw repository, which the fetch reads and keeps. The pull
      # extracts .git only and leaves the worktree empty, so origin/ is put back
      # on disk first. The fetch itself fails a run that wrote no table, so the
      # check below, which the restored pages would satisfy, is not what guards
      # this one.
      - name: Restore origin/
        run: |
          set -euo pipefail

          dir="ghcr.io/${{ github.repository }}/vuls-data-raw-redhat-package-manifest"
          if [[ -n $(git -C "${dir}" ls-files -- origin/) ]]; then
            git -C "${dir}" restore -- origin/
          fi

      - name: Fetch all
        run: vuls-data-update fetch redhat-package-manifest --dir ghcr.io/${{ github.repository }}/vuls-data-raw-redhat-package-manifest

      - name: Set Git remote
        run: |
          if git -C ghcr.io/${{ github.repository }}/vuls-data-raw-redhat-package-manifest remote | grep -q "^origin$"; then
            git -C ghcr.io/${{ github.repository }}/vuls-data-raw-redhat-package-manifest remote set-url origin ghcr.io/${{ github.repository }}:vuls-data-raw-redhat-package-manifest
          else
            git -C ghcr.io/${{ github.repository }}/vuls-data-raw-redhat-package-manifest remote add origin ghcr.io/${{ github.repository }}:vuls-data-raw-redhat-package-manifest
          fi

      # A run that writes nothing leaves the repository empty, and committing
      # that is a green run that quietly dropped the data. Stop before the
      # commit -- and before any restore, which would put the files back and
      # hide it. (The restore of origin/ above precedes it anyway; see there
      # for what guards this job instead.)
      - name: Ensure the repository was left populated
        run: |
          set -euo pipefail

          if [[ -z $(find ghcr.io/${{ github.repository }}/vuls-data-raw-redhat-package-manifest -name .git -prune -o -type f -print -quit) ]]; then
            echo "::error::no files left on disk in ghcr.io/${{ github.repository }}/vuls-data-raw-redhat-package-manifest. refusing to commit an empty repository"
            exit 1
          fi

      # The raw repository is also written by hand: new pages are stored in
      # origin/ and pushed from a checkout (.github/redhat-package-manifest-issue.md).
      # A push replaces the tag, so a run that pushed the tree it pulled would
      # take back pages pushed since. A run that committed nothing -- every
      # run but one after vuls-data-update reads the pages differently --
      # pushes nothing.
      - name: Commit
        id: commit
        run: |
          if [[ -n $(git -C ghcr.io/${{ github.repository }}/vuls-data-raw-redhat-package-manifest status --porcelain) ]]; then
            git -C ghcr.io/${{ github.repository }}/vuls-data-raw-redhat-package-manifest add .
            git -C ghcr.io/${{ github.repository }}/vuls-data-raw-redhat-package-manifest commit -m "update" -m "GitHub Actions: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/job/${{ job.check_run_id }}"
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create dotgit tarball
        if: steps.commit.outputs.committed == 'true'
        run: vuls-data-update dotgit compress ghcr.io/${{ github.repository }}/vuls-data-raw-redhat-package-manifest

      - name: Push ghcr.io/${{ github.repository }}:vuls-data-raw-redhat-package-manifest
        if: steps.commit.outputs.committed == 'true'
        run: vuls-data-update dotgit registry push --force --token ${{ secrets.GITHUB_TOKEN }} ghcr.io/${{ github.repository }}:vuls-data-raw-redhat-package-manifest vuls-data-raw-redhat-package-manifest.tar.zst
