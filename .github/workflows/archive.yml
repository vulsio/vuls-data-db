name: Archive

run-name: "Archive ${{ inputs.tag }} by @${{ github.actor }}"

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      threshold-mb:
        required: true
        type: number
  workflow_dispatch:
    inputs:
      tag:
        description: "e.g. vuls-data-raw-alpine-secdb"
        required: true
        type: string
      threshold-mb:
        required: true
        type: number

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Check Layer Size
    uses: ./.github/workflows/check-layer-size.yml
    with:
      repository: ${{ github.repository }}
      tag: ${{ inputs.tag }}
      media-type: application/vnd.vulsio.vuls-data-db.dotgit.layer.v1.tar+zstd
      threshold-mb: ${{ inputs.threshold-mb }}

  archive:
    name: Archive ${{ inputs.tag }}
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    needs: [check]
    if: ${{ needs.check.outputs.exceeded == 'true' }}
    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@90e01b21170618765a73370fcc3abbd1684a7793 # v5
        with:
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          remove-large-packages: "false"
          remove-cached-tools: "true"
          remove-swapfile: "true"

      - name: Set global git config
        run: |
          git config --global gc.auto 0
          git config --global maintenance.auto false
          git config --global init.defaultBranch main
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

      - name: Set up Go 1.x
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: "stable"
          cache: false

      - name: Install vuls-data-update
        run: go install github.com/MaineK00n/vuls-data-update/cmd/vuls-data-update@main

      - name: Pull ghcr.io/${{ github.repository }}:${{ inputs.tag }}
        run: vuls-data-update dotgit pull --dir . --checkout main ghcr.io/${{ github.repository }}:${{ inputs.tag }}

      - name: Set archive suffix
        id: set_archive_suffix
        run: |
          ARCHIVE_MAX=$(
              (
                echo "${{ inputs.tag }}-archive-0" ;
                vuls-data-update dotgit registry ls --repositories "ghcr.io/vulsio/vuls-data-db-archive" --token ${{ secrets.GITHUB_TOKEN }} | jq -r '.[] | select(.name | startswith("ghcr.io/vulsio/vuls-data-db-archive:${{ inputs.tag }}-archive-")) | .name' | sed 's/^ghcr.io\/vulsio\/vuls-data-db-archive://g'
              ) |
              sed -e 's/${{ inputs.tag }}-archive-//' |
              sort -rn |
              head -1
          )
          ARCHIVE_SUFFIX=archive-$(( ${ARCHIVE_MAX} + 1 ))
          echo "archive_suffix=${ARCHIVE_SUFFIX}" | tee ${GITHUB_OUTPUT}

      - name: Split archive
        id: split_archive
        run: |
          echo "Create the latest repository..."
          git clone --depth 1 --no-single-branch --no-checkout --branch main file://${PWD}/ghcr.io/${{ github.repository }}/${{ inputs.tag }} ${{ inputs.tag }}
          if git -C ${{ inputs.tag }} remote | grep -q "^origin$"; then
            git -C ${{ inputs.tag }} remote set-url origin ghcr.io/${{ github.repository }}:${{ inputs.tag }}
          else
            git -C ${{ inputs.tag }} remote add origin ghcr.io/${{ github.repository }}:${{ inputs.tag }}
          fi
          git -C ${{ inputs.tag }} reset

          vuls-data-update dotgit compress ${{ inputs.tag }}

      # A tag whose latest commit alone nears the threshold would be archived
      # on nearly every run, each archive a copy of that one commit. Wait until
      # the history the archive takes away outweighs the commit that stays.
      - name: Check the history outweighs the latest commit
        id: history
        run: |
          SIZE=$(vuls-data-update dotgit registry status ghcr.io/${{ github.repository }}:${{ inputs.tag }} | jq '.layers[] | select(.mediaType == "application/vnd.vulsio.vuls-data-db.dotgit.layer.v1.tar+zstd") | .size')
          LATEST=$(stat -c %s ${{ inputs.tag }}.tar.zst)
          echo "repository size [MB]: $(( SIZE / 1024 / 1024 ))"
          echo "latest commit size [MB]: $(( LATEST / 1024 / 1024 ))"
          if [[ ${SIZE} -gt $(( LATEST * 2 )) ]]; then
            echo "archive=true" >> "$GITHUB_OUTPUT"
          fi

      # Only the latest commit gets the aggressive GC. It is what every pull
      # downloads, and its GC time does not grow with the history; the history
      # goes to the archive as the writers' repack left it.
      - name: Run git gc on the latest commit
        if: ${{ steps.history.outputs.archive == 'true' }}
        run: |
          /usr/bin/time -v git -C ${{ inputs.tag }} -c pack.threads=1 -c pack.windowMemory=4g gc --aggressive --force
          vuls-data-update dotgit compress ${{ inputs.tag }}

      - name: Push archive dotgit
        if: ${{ steps.history.outputs.archive == 'true' }}
        run: vuls-data-update dotgit registry cp --token ${{ secrets.GITHUB_TOKEN }} ghcr.io/${{ github.repository }}:${{ inputs.tag }} ghcr.io/vulsio/vuls-data-db-archive:${{ inputs.tag }}-${{ steps.set_archive_suffix.outputs.archive_suffix }}

      - name: Push latest dotgit
        if: ${{ steps.history.outputs.archive == 'true' }}
        run: vuls-data-update dotgit registry push --force --token ${{ secrets.GITHUB_TOKEN }} ghcr.io/${{ github.repository }}:${{ inputs.tag }} ${{ inputs.tag }}.tar.zst
