name: Cleanup vulsio/vuls-data-db

on:
  # Pipelines pushes around the clock, so this runs on a clock too rather
  # than after any one workflow.
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  cleanup:
    name: Cleanup untagged images in vulsio/vuls-data-db
    uses: ./.github/workflows/cleanup.yml
    permissions:
      contents: read
      packages: write
    with:
      package: vuls-data-db
