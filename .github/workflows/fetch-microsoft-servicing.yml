name: Fetch Microsoft Servicing

run-name: "Fetch vuls-data-raw-microsoft-servicing by @${{ github.actor }}"

on:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  list-names:
    name: List Microsoft Servicing target names
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      include: ${{ steps.list.outputs.include }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - id: list
        run: |
          include="$(jq -c . .github/workflows/microsoft-servicing-targets.json)"
          echo "include=${include}" >> "$GITHUB_OUTPUT"

  fetch:
    name: Fetch vuls-data-raw-microsoft-servicing ${{ matrix.name }}
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    needs: [list-names]
    strategy:
      fail-fast: false
      # One shard at a time, because support.microsoft.com throttles on a
      # quota over a window and what clears it is going quiet. The fetcher's
      # doc measures that: the window is 3 to 5 seconds with nothing asking,
      # a lone worker's first retry clears it, and a third worker keeps the
      # quota spent while the other two back off. Its default concurrency of 2
      # is the largest that holds -- so one shard is two askers, the shape
      # measured clean, and fifteen shards was thirty.
      #
      # Not `--wait`, which the same doc rules out for this host: the quota is
      # over a window, so a slower crawl reaches it having fetched less. That
      # is the opposite of fetch-msuc.yml, where the catalog answers a
      # throttled query with silence instead and #237 did lower the rate.
      #
      # Serialising costs this source about two hours where the matrix took
      # one, and costs Fetch All nothing: msuc's branch is what sets that run's
      # length, 4h54m of a 4h55m one measured, against this source's 1h08m.
      # The 6 hour limit is per job, not per run -- and no shard job has come
      # near it, the longest being 25m.
      max-parallel: 1
      matrix:
        include: ${{ fromJson(needs.list-names.outputs.include) }}
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@90e01b21170618765a73370fcc3abbd1684a7793 # v5
        with:
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          remove-large-packages: "true"
          remove-cached-tools: "true"
          remove-swapfile: "true"

      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          repository: MaineK00n/vuls-data-update
          ref: main

      - name: Set up Go 1.x
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: "go.mod"

      - name: Install vuls-data-update
        run: go install ./cmd/vuls-data-update

      - name: Fetch
        run: |
          mkdir vuls-data-raw-microsoft-servicing
          vuls-data-update fetch microsoft-servicing --dir vuls-data-raw-microsoft-servicing ${{ join(matrix.target, ' ') }}

      - name: Create tarball
        run: tar --remove-files -acf vuls-data-raw-microsoft-servicing.tar.zst vuls-data-raw-microsoft-servicing || [[ $? == 1 ]]

      - name: Push ghcr.io/vulsio/vuls-data-db:microsoft-servicing-data-${{ matrix.name }}
        run: vuls-data-update dotgit registry push --force --token ${{ secrets.GITHUB_TOKEN }} ghcr.io/vulsio/vuls-data-db:microsoft-servicing-data-${{ matrix.name }} vuls-data-raw-microsoft-servicing.tar.zst

  commit:
    name: Commit vuls-data-raw-microsoft-servicing
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    if: ${{ success() || failure() }}
    needs: [list-names, fetch]
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@90e01b21170618765a73370fcc3abbd1684a7793 # v5
        with:
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          remove-large-packages: "true"
          remove-cached-tools: "true"
          remove-swapfile: "true"

      - name: Set global git config
        run: |
          git config --global gc.auto 0
          git config --global maintenance.auto false
          git config --global init.defaultBranch main
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

      - name: Set up Go 1.x
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: "stable"
          cache: false

      - name: Install vuls-data-update
        run: go install github.com/MaineK00n/vuls-data-update/cmd/vuls-data-update@main

      - name: Pull ghcr.io/${{ github.repository }}:vuls-data-raw-microsoft-servicing
        run: vuls-data-update dotgit pull --dir . --checkout main ghcr.io/${{ github.repository }}:vuls-data-raw-microsoft-servicing

      - name: Aggregate microsoft-servicing-data-*
        env:
          # Filtered by the expression engine and read from the environment,
          # rather than interpolated into the script: the expression is
          # substituted before bash parses it, so an apostrophe in a group
          # comment ended the quoted string and bash ran the rest of the JSON
          # as commands. The names are also all this step needs, and the only
          # part of it certain to stay inside MAX_ARG_STRLEN, the 131072 bytes
          # one environment string is capped at -- msuc's include is already
          # past that at 161442.
          NAMES: ${{ toJson(fromJson(needs.list-names.outputs.include).*.name) }}
        run: |
          # Read out first, and only from a non-empty array: "[]" is not an
          # empty string, jq -e exits 0 on empty input, jq length counts a
          # string or an object too, and an error inside < <(...) does not fail
          # the step -- so every one of those would leave the loop running zero
          # times and the step green having aggregated nothing.
          names="$(jq -er 'if type == "array" and length > 0 then .[] else error("not a non-empty array") end' <<< "${NAMES}" || true)"
          if [[ -z "${names}" ]]; then
            echo "::error::no shard names in the list-names output"
            exit 1
          fi
          while read -r name; do
            vuls-data-update dotgit pull --dir . --checkout "" "ghcr.io/${{ github.repository }}:microsoft-servicing-data-${name}"
            # every shard writes the same top-level origin/ and raw/, so merge instead of mv
            if ls "ghcr.io/${{ github.repository }}/microsoft-servicing-data-${name}/"* >/dev/null 2>&1; then
              cp -a "ghcr.io/${{ github.repository }}/microsoft-servicing-data-${name}/"* "ghcr.io/${{ github.repository }}/vuls-data-raw-microsoft-servicing/"
            fi
            rm -rf "ghcr.io/${{ github.repository }}/microsoft-servicing-data-${name}"
          done <<< "${names}"

      - name: Set Git remote
        run: |
          if git -C ghcr.io/${{ github.repository }}/vuls-data-raw-microsoft-servicing remote | grep -q "^origin$"; then
            git -C ghcr.io/${{ github.repository }}/vuls-data-raw-microsoft-servicing remote set-url origin ghcr.io/${{ github.repository }}:vuls-data-raw-microsoft-servicing
          else
            git -C ghcr.io/${{ github.repository }}/vuls-data-raw-microsoft-servicing remote add origin ghcr.io/${{ github.repository }}:vuls-data-raw-microsoft-servicing
          fi

      - name: Commit
        run: |
          if [[ -n $(git -C ghcr.io/${{ github.repository }}/vuls-data-raw-microsoft-servicing status --porcelain) ]]; then
            git -C ghcr.io/${{ github.repository }}/vuls-data-raw-microsoft-servicing add .
            git -C ghcr.io/${{ github.repository }}/vuls-data-raw-microsoft-servicing commit -m "update" -m "GitHub Actions: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/job/${{ job.check_run_id }}"
          fi

      - name: Create dotgit tarball
        run: vuls-data-update dotgit compress ghcr.io/${{ github.repository }}/vuls-data-raw-microsoft-servicing

      - name: Push ghcr.io/${{ github.repository }}:vuls-data-raw-microsoft-servicing
        run: vuls-data-update dotgit registry push --force --token ${{ secrets.GITHUB_TOKEN }} ghcr.io/${{ github.repository }}:vuls-data-raw-microsoft-servicing vuls-data-raw-microsoft-servicing.tar.zst

