      group: source-${{ matrix.source.name }}
    uses: ./.github/workflows/fetch-vulncheck.yml
    permissions:
      contents: read
      packages: write
    with:
      target: ${{ matrix.source.name }}
    secrets:
      VULNCHECK_API_KEY: ${{ secrets.VULNCHECK_API_KEY }}

  vulncheck:
    name: ${{ matrix.source.name }}
    needs: [plan, fetch-vulncheck]
    if: ${{ !cancelled() && (needs.fetch-vulncheck.result == 'success' || needs.fetch-vulncheck.result == 'failure') }}
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON(needs.plan.outputs.kinds).vulncheck }}
    concurrency:
      group: source-${{ matrix.source.name }}
    uses: ./.github/workflows/source-pipeline.yml
    permissions:
      actions: write
      contents: read
      packages: write
    with:
      source: ${{ toJSON(matrix.source) }}

  action-run-summary:
    name: Action run summary
    if: ${{ !cancelled() }}
    needs: [main, alma-errata, amazon, cisco-cvrf-or-csaf, cisco-json, enisa-euvd-list, epss, fedora-api, fortinet-csaf, fortinet-cvrf, microsoft-servicing, msuc, nuclei-api, nvd-api, paloalto-json-or-csaf, redhat-package-manifest, variot, vulncheck]
    uses: ./.github/workflows/action-run-summary.yml
    permissions:
      contents: read
      actions: read
