name: Truncate

run-name: "Truncate ${{ inputs.tag }} by @${{ github.actor }}"

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      threshold-mb:
        required: true
        type: number
      log-ratio:
        required: true
        type: number
  workflow_dispatch:
    inputs:
      tag:
        description: "e.g. vuls-data-extracted-alpine-secdb"
        required: true
        type: string
      threshold-mb:
        required: true
        type: number
      log-ratio:
        required: true
        type: number

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  check-before-gc:
    name: Check Layer Size before Git GC
    uses: ./.github/workflows/check-layer-size.yml
    with:
      repository: ${{ github.repository }}
      tag: ${{ inputs.tag }}
      media-type: application/vnd.vulsio.vuls-data-db.dotgit.layer.v1.tar+zstd
      threshold-mb: ${{ inputs.threshold-mb }}

  gc:
    name: Git GC ${{ inputs.tag }}
    needs: [check-before-gc]
    if: ${{ needs.check-before-gc.outputs.exceeded == 'true' }}
    uses: ./.github/workflows/gc.yml
    permissions:
      contents: read
      packages: write
    with:
      repository: ${{ github.repository }}
      tag: ${{ inputs.tag }}
      pack-threads: 2
      pack-windowMemory: 4g

  check-after-gc:
    name: Check Layer Size after Git GC
    needs: [gc]
    uses: ./.github/workflows/check-layer-size.yml
    with:
      repository: ${{ github.repository }}
      tag: ${{ inputs.tag }}
      media-type: application/vnd.vulsio.vuls-data-db.dotgit.layer.v1.tar+zstd
      threshold-mb: ${{ inputs.threshold-mb }}

  truncate:
    name: Truncate ${{ inputs.tag }}
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    needs: [check-after-gc]
    if: ${{ needs.check-after-gc.outputs.exceeded == 'true' }}
    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@90e01b21170618765a73370fcc3abbd1684a7793 # v5
        with:
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          remove-large-packages: "false"
          remove-cached-tools: "true"
          remove-swapfile: "true"

      - name: Set global git config
        run: |
          git config --global gc.auto 0
          git config --global maintenance.auto false
          git config --global init.defaultBranch main
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

      - name: Set up Go 1.x
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: "stable"
          cache: false

      - name: Install vuls-data-update
        run: go install github.com/MaineK00n/vuls-data-update/cmd/vuls-data-update@main

      - name: Pull ghcr.io/${{ github.repository }}:${{ inputs.tag }}
        run: vuls-data-update dotgit pull --dir . --checkout main ghcr.io/${{ github.repository }}:${{ inputs.tag }}

      - name: Decide log length
        id: decide_log_length
        run: |
          TOTAL=$(git -C ghcr.io/${{ github.repository }}/${{ inputs.tag }} log --oneline main | wc -l)
          LENGTH=$(echo "scale=0; ${TOTAL} * ${{ inputs.log-ratio }} / 1" | bc)
          echo "Will truncate log length ${TOTAL} -> ${LENGTH}"
          echo "length=${LENGTH}" >> ${GITHUB_OUTPUT}

      - name: Truncate dotgit
        run: |
          echo "Create the truncated repository..."
          git clone --depth ${{ steps.decide_log_length.outputs.length }} --no-single-branch --no-checkout --branch main file://${PWD}/ghcr.io/${{ github.repository }}/${{ inputs.tag }} ${{ inputs.tag }}
          git -C ${{ inputs.tag }} reset
          git -C ${{ inputs.tag }} branch nightly origin/nightly

          rm -rf ghcr.io/${{ github.repository }}/${{ inputs.tag }}
          vuls-data-update dotgit compress ${{ inputs.tag }}

      - name: Push truncated dotgit
        run: vuls-data-update dotgit registry push --force --token ${{ secrets.GITHUB_TOKEN }} ghcr.io/${{ github.repository }}:${{ inputs.tag }} ${{ inputs.tag }}.tar.zst
