name: Cleanup vulsio/vuls-data-db-archive

on:
  # Each source's pipeline archives whenever it runs, so this runs on a clock
  # rather than after any one workflow.
  schedule:
    - cron: "50 2 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  cleanup:
    name: Cleanup untagged images in vulsio/vuls-data-db-archive
    uses: ./.github/workflows/cleanup.yml
    permissions:
      contents: read
      packages: write
    with:
      package: vuls-data-db-archive
